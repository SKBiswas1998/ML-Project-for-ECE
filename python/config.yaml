# Single source of every constant used by the pipeline.
# Paths are relative to the repository root (the folder that holds python/).

paths:
  data_dir: ML_edge_vacancy_seed2026   # NEGF output, read-only
  results_dir: results                 # experiment CSVs (input to make_figures.py)
  figures_dir: figures
  cache_dir: results/cache             # intermediate fits, makes long runs resumable

data:
  iv_train: ML_IV_train.csv            # one row per gate point
  iv_test: ML_IV_test.csv
  metrics_train: ML_metrics_train.csv  # one row per curve (gate sweep)
  metrics_test: ML_metrics_test.csv
  negf_all: NEGF_all.mat               # layout info (vac_atoms, nested), scipy.io.loadmat
  curve_key: [T_K, vac_pct]            # identifies one gate sweep
  gate_column: VTG_minus_VBG_V         # lambda_eV and Ez_V_per_A are linear copies of it
  points_per_curve: 20                 # gate points per sweep, verified in Stage 0
  expected_rows:                       # verified in Stage 0; loader fails loudly if they change
    iv_train: 12760
    iv_test: 3200
    metrics_train: 638
    metrics_test: 160
  expected_seed: 2026                  # single random vacancy layout
  gate_grid_tolerance_V: 1.0e-9        # gate values of all curves must agree to this

physics:
  k_B_eV_per_K: 8.617333262e-5         # Boltzmann constant (CODATA 2018)
  V_DS_V: 0.05                         # drain bias (NEGF_all.mat: Vds); SPD = V_DS * Ioff
  dynamic_power: DED_over_tau          # P_dyn = DED_J / tau_d_s (the ONE convention)

targets:
  ioff_primary: last                   # 'last' = supplied Ioff (I at V = 1.9 V); 'min' = curve minimum
  ioff_secondary: min                  # reported alongside the primary
  swing:
    pchip_points: 2001                 # fine V grid for the PCHIP slope (~1 mV spacing over 1.9 V)
    min_drop_decades: 1.0              # branches falling less than this have no defined swing (NaN)
    check_T_K: [4, 40, 78]             # temperatures shown in the swing check figure
    check_vac_pct: [0.0, 0.6, 1.3, 2.0]  # clean, non-monotone (0.6/1.3), most damaged
    tangent_half_width_V: 0.15         # plotted tangent extends +/- this around the steepest point

splits:
  vac_step_pct: 0.1                    # spacing of the vacancy grid; levels are indexed round(vac/step)
  temp_train_max_K: 60                 # protocol 2 (forward-chaining): train T <= 60 K, test 62-78 K
  vac_block_holdout_pct: [0.8, 1.2]    # protocol 3a: middle block of consecutive levels held out
  vac_train_max_pct: 1.5               # protocol 3b: train <= 1.5 %, test 1.6-2.0 %
  holdout_embargo_levels: 0            # levels dropped next to a FINAL test block (0 = none, see DECISIONS)
  cv_n_blocks: 5                       # hyperparameter CV: blocks of consecutive vacancy levels
  cv_embargo_levels: 1                 # levels dropped on each side of the held-out CV block

inputs:
  vacancy_features: [vac_pct, n_vac_atoms]   # each model is run once per vacancy encoding
  gate_decimals: 6                     # gate values rounded to this for exact per-gate grouping

experiments:
  point_target: log10_I                # per gate point, inputs (T, vacancy, gate)
  point_vacancy_features: [vac_pct]    # log10_I runs one encoding only: the per-gate GP costs ~170 s/job
  curve_targets: [log10_Ion_Ioff, log10_Ion_Ioff_min, log10_SPD, log10_DED, log10_tau_d,
                  log10_P_dyn, swing_mV_per_dec]   # per curve, inputs (T, vacancy)
  cv_scoring: neg_mean_squared_error
  mlp_targets: [log10_I, log10_Ion_Ioff, log10_Ion_Ioff_min, swing_mV_per_dec]  # SPD = Ion/Ioff copy; P_dyn, DED, tau ~constant
  mlp_vacancy_feature: vac_pct         # Stage 4: encoding made no difference (median MAE ratio 1.0)
  mlp_iv_mode: curve_output           # log10_I: input (T, vac) -> 20 outputs per curve (638 rows, not 12,760)
  mlp_iv_max_epochs: 8000             # log10_I only: 1,500 was hit by every supplied-split seed; patience still decides

models:
  ridge:
    alpha: [1.0e-4, 1.0e-2, 1.0, 100.0]
  poly_ridge:
    degree: [2, 3, 4, 5]
    alpha: [1.0e-4, 1.0e-2, 1.0]
  boosting:                            # sklearn HistGradientBoostingRegressor
    max_depth: [2, 4, 6]
    max_iter: [100, 300]               # number of trees
    learning_rate: 0.1
  gp:                                  # one GP per gate point for log10_I; <= 638 points each
    kernels: [rbf, matern25]           # chosen per fit by log marginal likelihood (not CV, see DECISIONS)
    length_scale_bounds: [0.05, 100.0] # standardised units; 0.05 < one vacancy step (~0.17) -> levels may decorrelate
    noise_init: 1.0e-3                 # WhiteKernel start; absorbs non-smooth NEGF structure
    noise_bounds: [1.0e-8, 1.0]
    n_restarts_optimizer: 0            # each fit 3-6 s on 638 points; restarts did not change the optimum
  mlp:                                 # PyTorch, CPU, full-batch Adam on standardised X and y
    width: [64, 128]                   # units per hidden layer (tuned)
    depth: [2, 3]                      # hidden layers (tuned)
    weight_decay: [0.0, 1.0e-4]        # L2 penalty in AdamW (tuned)
    dropout: 0.0                       # fixed: data are noiseless simulation output
    learning_rate: 3.0e-3
    max_epochs: 1500
    patience: 100                      # early stopping: epochs without validation improvement
    eval_every: 5                      # epochs between validation checks (copying weights is costly)
    batch_size: 512                    # rows per Adam step; tasks with fewer rows train full-batch
    early_stop_fraction: 0.15          # share of training CURVES held out for early stopping
    seeds: [0, 1, 2, 3, 4]             # initialisation seeds; tuning uses the first
  seed: 0                              # random_state for every stochastic sklearn model

compute:
  device: cpu                          # never assume CUDA
  torch_threads: 1                     # per MLP fit; fits run in parallel instead (small nets scale poorly)
  n_jobs: 2                            # parallel fits; 4 ran the PC out of memory during the MLP run
  num_workers: 0                       # DataLoader workers; 0 is required on Windows
