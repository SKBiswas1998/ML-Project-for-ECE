# Runs the unit tests only. It never runs the experiment pipeline, never writes results,
# and never pushes. The tests read only files tracked in the repository (the four
# ML_edge_vacancy_seed2026/*.csv files, NEGF_all.mat and python/config.yaml).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read            # read-only token: the workflow cannot push or change the repository

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONWARNINGS: ignore
        run: python -m pytest -q
